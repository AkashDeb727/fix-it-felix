<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fix-It Felix | AI Municipal Maintenance & Incident Portal</title>
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          if (originalFetch) {
            var _currentFetch = originalFetch;
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return _currentFetch;
              },
              set: function(fn) {
                _currentFetch = fn;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          console.warn('Fetch setter safeguard:', e);
        }
      })();
    </script>
    <!-- Leaflet.js CSS for Interactive Maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  </head>
  <body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
